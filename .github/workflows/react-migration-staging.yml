name: React migration staging checks

on:
  push:
    branches:
      - feature/react-migration-foundation
    paths:
      - "react/**"
      - ".github/workflows/react-migration-staging.yml"
  pull_request:
    branches:
      - main
    paths:
      - "react/**"
      - ".github/workflows/react-migration-staging.yml"

jobs:
  build-static-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build static export
        run: npm run build
