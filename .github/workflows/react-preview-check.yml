name: React migration preview checks

on:
  pull_request:
    paths:
      - "react-app/**"
      - ".github/workflows/react-preview-check.yml"
  push:
    branches:
      - "feature/react-migration-foundation"
    paths:
      - "react-app/**"
      - ".github/workflows/react-preview-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Build static export
        run: npm run build
