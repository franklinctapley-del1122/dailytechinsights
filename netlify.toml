# Netlify configuration for DailyTechInsights
# Canonical domain: https://www.dailytechinsights.com/

[[redirects]]
  from = "/*"
  to = "https://www.dailytechinsights.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["dailytechinsights.com", "dailytechinsights.netlify.app"]}

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true
